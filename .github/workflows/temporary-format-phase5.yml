name: Temporary format for Phase 5

on:
  push:
    branches:
      - codex/fase-5-inspector-gtfs

permissions:
  contents: write

concurrency:
  group: format-phase-5
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/fase-5-inspector-gtfs
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Format Phase 5 source and docs
        run: npx prettier --write docs/ROADMAP.md src/App.test.tsx src/App.tsx src/components/GtfsInspector.tsx src/data/gtfs.ts src/data/gtfs.test.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "No formatting changes are needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md src/App.test.tsx src/App.tsx src/components/GtfsInspector.tsx src/data/gtfs.ts src/data/gtfs.test.ts
          git commit -m "style(phase-5): format GTFS inspector implementation"
          git push origin HEAD:codex/fase-5-inspector-gtfs
