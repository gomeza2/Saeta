name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Check TypeScript
        run: npm run typecheck
      - name: Check lint
        run: npm run lint
      - name: Capture canonical formatting
        run: |
          npx prettier --write docs/ROADMAP.md src/components/MapPreview.test.tsx src/components/MapPreview.tsx
          for file in docs/ROADMAP.md src/components/MapPreview.test.tsx src/components/MapPreview.tsx; do
            echo "BEGIN_FORMATTED_FILE:$file"
            cat "$file"
            echo "END_FORMATTED_FILE:$file"
          done
      - name: Check formatting
        run: npm run format:check
      - name: Run tests
        run: npm run test
      - name: Build production bundle
        run: npm run build
